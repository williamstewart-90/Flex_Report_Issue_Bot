name: Sync VT Flex Issues

on:
  schedule:
    # Hourly ticks, every day, 11:00-23:37 UTC (about 6 AM-6:30 PM Central
    # during CDT, 5 AM-5:30 PM during CST). Not `*/5`.
    #
    # GitHub drops high-frequency schedule slots instead of catching them up.
    # On this public repo, `*/5 12-23 * * 1-5` fired about 3 times a day in
    # October 2026, usually after 17:00 UTC, and never on Saturday or Sunday.
    # The dashboard then showed an empty Fri-night-through-Monday-morning gap.
    # Single-minute crons are delayed under load but are not dropped the way
    # `*/5` is. :07 and :37 stay off the top of the hour, which is the busiest
    # minute for Actions schedules.
    #
    # Public-repo gotcha: GitHub auto-disables scheduled workflows after 60
    # days with no repository activity (commits/pushes). Workflow runs alone
    # do not count. Push any commit before that window closes to keep the
    # cron alive; this file's history is a convenient place to do that.
    - cron: '7 11,13,15,17,19,21,23 * * *'
    - cron: '37 12,14,16,18,20,22 * * *'
  workflow_dispatch:    # Allow manual runs from the Actions tab

concurrency:
  group: vt-flex-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Full history is ~200 pages and still growing. Incremental runs finish
    # in a couple of pages; the Monday-morning reconcile walks everything.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22+: native WebSocket support, which @supabase/supabase-js
          # initializes at client construction (Realtime). Node 20 fails here.
          node-version: '22'

      - name: Install deps
        working-directory: vt-flex-issues-dashboard/scripts
        run: npm ci || npm install

      - name: Run sync
        working-directory: vt-flex-issues-dashboard/scripts
        env:
          VT_FLEX_BEARER_TOKEN:         ${{ secrets.VT_FLEX_BEARER_TOKEN }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VT_FLEX_ISSUE_TYPE:           technical_issue

          # ---- Manager notification pipeline (notify.mjs) ----
          # See vt-flex-issues-dashboard/README.md "Manager-notification pipeline"
          # for rollout details. NOTIFICATIONS_FORCE_TO acts as the shadow-mode
          # switch: while set, every email routes there instead of supervisors.
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:              ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_MAX_TOKENS:         ${{ secrets.ANTHROPIC_MAX_TOKENS }}
          GMAIL_USER:                   ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:           ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATIONS_FROM_EMAIL:     ${{ secrets.NOTIFICATIONS_FROM_EMAIL }}
          NOTIFICATIONS_FORCE_TO:       ${{ secrets.NOTIFICATIONS_FORCE_TO }}
          NOTIFICATIONS_ENABLED:        ${{ secrets.NOTIFICATIONS_ENABLED }}
          MAX_NOTIFICATIONS_PER_RUN:    ${{ secrets.MAX_NOTIFICATIONS_PER_RUN }}
          NOTIFICATIONS_RECENCY_HOURS:  ${{ secrets.NOTIFICATIONS_RECENCY_HOURS }}
        run: node sync-issues.mjs

      # ---- Slack manager-notification route (post-to-slack.mjs) ----
      # Runs after the sync + email pipeline. Posts actionable issues
      # (filtered through scripts/lib/issue-filter.mjs) with full AI triage
      # to SLACK_CHANNEL_ID. Isolated from the sync step via `if: always()`
      # so a Slack outage never blocks the email pipeline or the data sync.
      - name: Post to Slack
        if: always()
        working-directory: vt-flex-issues-dashboard/scripts
        env:
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:              ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_MAX_TOKENS:         ${{ secrets.ANTHROPIC_MAX_TOKENS }}
          # Auth: SLACK_WEBHOOK_URL is preferred (works without admin bot-app
          # approval). SLACK_BOT_TOKEN + SLACK_CHANNEL_ID is the fallback for
          # when we want threaded replies / multi-channel posting later.
          SLACK_WEBHOOK_URL:            ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN:              ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID:             ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_ENABLED:                ${{ secrets.SLACK_ENABLED }}
          MAX_SLACK_POSTS_PER_RUN:      ${{ secrets.MAX_SLACK_POSTS_PER_RUN }}
          SLACK_RECENCY_HOURS:          ${{ secrets.SLACK_RECENCY_HOURS }}
        run: node post-to-slack.mjs
