name: Sync VT Flex Issues

on:
  schedule:
    # Top of every hour (UTC). GitHub Actions cron is UTC-only.
    # If you ever want to bias toward business hours, restrict to a range,
    # e.g. '0 12-23 * * *' would run 7 AM - 6 PM Central.
    - cron: '0 * * * *'
  workflow_dispatch:    # Allow manual runs from the Actions tab

concurrency:
  group: vt-flex-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22+: native WebSocket support, which @supabase/supabase-js
          # initializes at client construction (Realtime). Node 20 fails here.
          node-version: '22'

      - name: Install deps
        working-directory: vt-flex-issues-dashboard/scripts
        run: npm ci || npm install

      - name: Run sync
        working-directory: vt-flex-issues-dashboard/scripts
        env:
          VT_FLEX_BEARER_TOKEN:         ${{ secrets.VT_FLEX_BEARER_TOKEN }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VT_FLEX_ISSUE_TYPE:           technical_issue
        run: node sync-issues.mjs
