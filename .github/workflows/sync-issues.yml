name: Sync VT Flex Issues

on:
  schedule:
    # Every 5 minutes, 12:00-23:55 UTC, Monday-Friday.
    # That's roughly 7 AM - 7 PM Central (CDT) / 6 AM - 6 PM Central (CST),
    # M-F. Goal: cut the rep-submits-issue -> manager-gets-pinged latency
    # from ~30-60 min (hourly cron + GH cron drift) down to 5-15 min during
    # the hours managers are actually online.
    #
    # GitHub Actions cron is UTC-only and "best effort" — real runs can
    # still drift 5-10 min during peak load on the runner.
    #
    # Cost: 12 runs/hr * ~2 min * 12 hrs * 5 days * 4.3 wks ≈ 6,200 min/mo.
    # Free tier (private repo) is 2,000 min/mo — see README for plan notes.
    #
    # Tuning knobs:
    #   '*/3 12-23 * * 1-5'    tighter ~3-min latency, ~10K min/mo
    #   '*/5 11-2  * * *'      6 AM - 9 PM Central, every day, ~12K min/mo
    #   '*/5 13-22 * * 1-5'    8 AM - 5 PM Central only, ~5K min/mo
    #   '0 * * * *'            original hourly, ~720 min/mo (free-tier safe)
    - cron: '*/5 12-23 * * 1-5'
  workflow_dispatch:    # Allow manual runs from the Actions tab

concurrency:
  group: vt-flex-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22+: native WebSocket support, which @supabase/supabase-js
          # initializes at client construction (Realtime). Node 20 fails here.
          node-version: '22'

      - name: Install deps
        working-directory: vt-flex-issues-dashboard/scripts
        run: npm ci || npm install

      - name: Run sync
        working-directory: vt-flex-issues-dashboard/scripts
        env:
          VT_FLEX_BEARER_TOKEN:         ${{ secrets.VT_FLEX_BEARER_TOKEN }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VT_FLEX_ISSUE_TYPE:           technical_issue

          # ---- Manager notification pipeline (notify.mjs) ----
          # See vt-flex-issues-dashboard/README.md "Manager-notification pipeline"
          # for rollout details. NOTIFICATIONS_FORCE_TO acts as the shadow-mode
          # switch: while set, every email routes there instead of supervisors.
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:              ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_MAX_TOKENS:         ${{ secrets.ANTHROPIC_MAX_TOKENS }}
          GMAIL_USER:                   ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:           ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATIONS_FROM_EMAIL:     ${{ secrets.NOTIFICATIONS_FROM_EMAIL }}
          NOTIFICATIONS_FORCE_TO:       ${{ secrets.NOTIFICATIONS_FORCE_TO }}
          NOTIFICATIONS_ENABLED:        ${{ secrets.NOTIFICATIONS_ENABLED }}
          MAX_NOTIFICATIONS_PER_RUN:    ${{ secrets.MAX_NOTIFICATIONS_PER_RUN }}
          NOTIFICATIONS_RECENCY_HOURS:  ${{ secrets.NOTIFICATIONS_RECENCY_HOURS }}
        run: node sync-issues.mjs

      # ---- Slack manager-notification route (post-to-slack.mjs) ----
      # Runs after the sync + email pipeline. Posts actionable issues
      # (filtered through scripts/lib/issue-filter.mjs) with full AI triage
      # to SLACK_CHANNEL_ID. Isolated from the sync step via `if: always()`
      # so a Slack outage never blocks the email pipeline or the data sync.
      - name: Post to Slack
        if: always()
        working-directory: vt-flex-issues-dashboard/scripts
        env:
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:              ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_MAX_TOKENS:         ${{ secrets.ANTHROPIC_MAX_TOKENS }}
          # Auth: SLACK_WEBHOOK_URL is preferred (works without admin bot-app
          # approval). SLACK_BOT_TOKEN + SLACK_CHANNEL_ID is the fallback for
          # when we want threaded replies / multi-channel posting later.
          SLACK_WEBHOOK_URL:            ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN:              ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID:             ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_ENABLED:                ${{ secrets.SLACK_ENABLED }}
          MAX_SLACK_POSTS_PER_RUN:      ${{ secrets.MAX_SLACK_POSTS_PER_RUN }}
          SLACK_RECENCY_HOURS:          ${{ secrets.SLACK_RECENCY_HOURS }}
        run: node post-to-slack.mjs
