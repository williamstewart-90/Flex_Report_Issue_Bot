[build]
  command  = "npm run build"
  publish  = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions live in netlify/functions (sibling of src/)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Allow the chat function up to 26 s for Anthropic responses
# (default is 10 s; the Pro plan ceiling is 26 s).
[functions."chat"]
  timeout = 26

# SPA redirect — all non-function routes serve index.html
# /.netlify/functions/* is handled by Netlify before this rule.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache-bust assets aggressively, HTML never
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
