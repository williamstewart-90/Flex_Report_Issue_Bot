[build]
  command  = "npm run build"
  publish  = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Tell Netlify's secret scanner which env-var NAMES are intentionally public.
  # VITE_* vars are baked into the browser bundle by design.
  # SUPABASE_URL is the project URL (not a secret; the service-role key IS).
  # Real secrets (ANTHROPIC_API_KEY, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_JWT_SECRET,
  # SYSTEM_PROMPT) are intentionally NOT listed here so the scanner keeps watching them.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,SUPABASE_URL"

# Serverless functions live in netlify/functions (sibling of src/)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Allow the chat function up to 26 s for Anthropic responses
# (default is 10 s; the Pro plan ceiling is 26 s).
[functions."chat"]
  timeout = 26

# SPA redirect — all non-function routes serve index.html
# /.netlify/functions/* is handled by Netlify before this rule.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache-bust assets aggressively, HTML never
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
